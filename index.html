<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1714">
<title>Morning HRV</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout: one phone-sized column; three screens (start, measuring, result) swap in place. */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --fg:#14201b; --muted:#5a6b64; --line:#d6dfdb;
  --accent:#d63a33; --accent-soft:#fbe2e0; --good:#1d7a52; --good-soft:#dcf2e7;
  --warn:#a86a00; --warn-soft:#fbefd2; --bad:#b4271f; --bad-soft:#f9dcd9; --skin:#e7b9a0; --phone:#26302c;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1714; --surface:#17211d; --fg:#e7eeea; --muted:#94a69e; --line:#2a3732;
  --accent:#ff6a5f; --accent-soft:#3b1c1a; --good:#4cc68f; --good-soft:#163428;
  --warn:#f0b445; --warn-soft:#3a2d12; --bad:#ff6a5f; --bad-soft:#3b1c1a; --skin:#c99779; --phone:#3a4641; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(32px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-size:1.5rem;margin:0;letter-spacing:-.01em}
.who{color:var(--muted);font-size:.9rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.headright{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.center{text-align:center;align-items:center}
.label{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 20%;padding:10px 6px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:12px 14px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650;font-size:1.15rem;padding:18px}
button.small{padding:8px 12px;font-size:.9rem}
button.link{border:none;background:none;color:var(--muted);padding:4px 0;font-size:.9rem;text-decoration:underline}
button.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:flex;gap:10px;align-items:flex-start}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:.9rem}
.illus{display:block;width:100%;max-width:260px;margin:0 auto}
.phase{font-size:1.3rem;font-weight:650}
.sub{color:var(--muted)}
.ringwrap{position:relative;width:200px;height:200px;margin:4px auto}
.ringwrap svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.lens{position:absolute;inset:24px;border-radius:50%;overflow:hidden;background:#000}
.lens video{width:100%;height:100%;object-fit:cover;display:block}
.lens svg{position:absolute;inset:0;width:100%;height:100%}
.readout{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.readout .box{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.readout .v{font-family:var(--mono);font-size:2rem;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.1}
.pill{border-radius:999px;padding:8px 14px;text-align:center;font-weight:600;font-size:.95rem;background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.good{background:var(--good-soft);color:var(--good)}
canvas{width:100%;display:block;border-radius:10px;background:var(--bg)}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:var(--bg);border-radius:12px;padding:12px}
.metric .v{font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.metric .u{font-size:.9rem;color:var(--muted);font-weight:500}
.badge{display:inline-block;border-radius:999px;padding:4px 12px;font-weight:650;font-size:.9rem}
.badge.good{background:var(--good-soft);color:var(--good)}
.badge.ok{background:var(--warn-soft);color:var(--warn)}
.badge.poor{background:var(--bad-soft);color:var(--bad)}
.msg{border-radius:12px;padding:12px 14px;font-weight:550}
.msg.normal{background:var(--good-soft);color:var(--good)}
.msg.low{background:var(--warn-soft);color:var(--warn)}
.msg.high{background:var(--good-soft);color:var(--good)}
.msg.info{background:var(--bg);color:var(--muted);font-weight:500}
.note{font-size:.88rem;color:var(--muted)}
.warnbox{background:var(--warn-soft);color:var(--fg);border-radius:10px;padding:10px 12px;font-size:.92rem}
.infobox{background:var(--good-soft);color:var(--fg);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.debug{font-family:var(--mono);font-size:.72rem;color:var(--muted);word-break:break-all}
.ver{font-size:.75rem;color:var(--muted);text-align:center;user-select:none}
table{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.tablewrap{overflow-x:auto}
details>summary{cursor:pointer;color:var(--fg);font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details>summary::after{content:"+";color:var(--muted);font-size:1.3rem;line-height:1}
details[open]>summary::after{content:"–"}
details>summary::-webkit-details-marker{display:none}
.lbl{display:flex;gap:8px;align-items:flex-start;font-size:.92rem}
.lbl input{margin-top:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Morning HRV</h1>
    <div class="headright">
      <button class="small" id="btnLang" type="button">हिंदी</button>
      <div class="who" id="who"></div>
    </div>
  </header>

  <!-- START SCREEN -->
  <section id="scrStart" class="stack">
    <div class="card stack">
      <svg class="illus" viewBox="0 0 260 170" role="img" aria-labelledby="illusT">
        <title id="illusT">Fingertip resting on the back camera of a phone</title>
        <rect x="70" y="8" width="120" height="200" rx="18" fill="var(--phone)"/>
        <rect x="88" y="26" width="64" height="34" rx="17" fill="#111"/>
        <circle cx="106" cy="43" r="13" fill="#2a3a4a" stroke="#555" stroke-width="2"/>
        <circle cx="135" cy="43" r="8" fill="#2a3a4a" stroke="#555" stroke-width="2"/>
        <circle cx="168" cy="38" r="5" fill="#ffe9a8"/>
        <path d="M92 170 L92 62 Q92 36 106 36 Q120 36 120 62 L120 170 Z" fill="var(--skin)" stroke="rgba(0,0,0,.25)" stroke-width="1.5"/>
        <path d="M100 52 Q106 46 112 52" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="1.5"/>
        <path d="M150 22 L176 10" stroke="var(--accent)" stroke-width="2.5"/>
        <text x="180" y="12" font-size="12" fill="var(--muted)" data-i="flashLbl">flash</text>
        <path d="M120 82 L196 104" stroke="var(--accent)" stroke-width="2.5"/>
        <text x="198" y="108" font-size="12" fill="var(--muted)" data-i="lensLbl">big lens</text>
      </svg>
      <ol class="steps">
        <li><span data-i="step1"></span></li>
        <li><span data-i="step2"></span></li>
        <li><span data-i="step3"></span></li>
      </ol>
    </div>
    <div class="infobox" id="installBox" hidden>
      <span data-i="install"></span>
      <button class="small" id="btnInstall" type="button" data-i="installBtn"></button>
    </div>
    <div class="warnbox" id="noSend" hidden data-i="noSend"></div>
    <div class="warnbox" id="notSupported" hidden data-i="notSupported"></div>
    <button class="primary" id="btnStart" type="button" data-i="start"></button>
    <div class="note center" id="durShow" style="display:flex;justify-content:center"></div>

    <details class="card" id="setBox">
      <summary data-i="settings"></summary>
      <div class="stack" style="margin-top:14px">
        <div class="label" data-i="length"></div>
        <div class="seg" id="durSeg">
          <button data-d="30" data-i="s30"></button>
          <button data-d="60" data-i="m1"></button>
          <button data-d="120" data-i="m2"></button>
          <button data-d="180" data-i="m3"></button>
          <button data-d="custom" data-i="custom"></button>
        </div>
        <div class="stack" id="customBox" hidden style="gap:10px">
          <div class="row" style="justify-content:flex-start">
            <label class="lbl" style="align-items:center"><input type="number" id="cMin" min="0" max="30" step="1" value="5" inputmode="numeric" style="width:4.5em;font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)"> <span data-i="customMin"></span></label>
            <label class="lbl" style="align-items:center"><input type="number" id="cSec" min="0" max="59" step="5" value="0" inputmode="numeric" style="width:4.5em;font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)"> <span data-i="customSec"></span></label>
          </div>
          <label class="lbl"><input type="checkbox" id="cOpen"> <span data-i="openEnded"></span></label>
          <div class="note" data-i="customHint"></div>
        </div>
        <div class="note" data-i="durNote"></div>
        <label class="lbl"><input type="checkbox" id="sound" checked> <span data-i="sound"></span></label>
        <div class="row"><button class="small" id="btnTestCue" type="button" data-i="testCue"></button><span class="note" id="cueMsg"></span></div>
        <label class="lbl"><input type="checkbox" id="lockExp"> <span data-i="lockExp"></span></label>
        <div class="row"><button class="small" id="btnResetCam" type="button" data-i="resetCam"></button><span class="note" id="camMsg"></span></div>
        <div class="note" id="installHow" data-i="installHow"></div>
        <div class="row" id="profileRow" hidden><span class="note" id="profileTxt"></span><button class="small" id="btnForget" type="button" data-i="forget"></button></div>
      </div>
    </details>
    <details class="card" id="histBox">
      <summary data-i="history"></summary>
      <div class="tablewrap" style="margin-top:10px"><table id="histTable"></table></div>
    </details>
    <div class="ver" id="ver">App version 0.7.1</div>
  </section>

  <!-- MEASURING SCREEN -->
  <section id="scrMeasure" class="stack" hidden>
    <div class="card stack center">
      <div>
        <div class="phase" id="phase"></div>
        <div class="sub" id="phaseSub"></div>
      </div>
      <div class="ringwrap">
        <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
          <circle cx="100" cy="100" r="92" fill="none" stroke="var(--line)" stroke-width="10"/>
          <circle id="ringBar" cx="100" cy="100" r="92" fill="none" stroke="var(--warn)" stroke-width="10" stroke-linecap="round" stroke-dasharray="578.05" stroke-dashoffset="578.05"/>
        </svg>
        <div class="lens">
          <video id="video" playsinline muted></video>
          <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 78 C20 58 14 40 26 30 C35 23 45 27 50 36 C55 27 65 23 74 30 C86 40 80 58 50 78 Z" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="3"/></svg>
        </div>
      </div>
      <div class="readout" style="width:100%">
        <div class="box"><div class="label" id="timeLbl" data-i="timeLeft"></div><div class="v" id="timer">--</div></div>
        <div class="box"><div class="label" data-i="hrNow"></div><div class="v" id="liveHr">--</div></div>
      </div>
      <div class="pill" id="status" style="width:100%"></div>
      <canvas id="wave" height="110"></canvas>
      <div class="row" style="width:100%">
        <span class="note" id="camName"></span>
        <button class="small" id="btnSwitch" type="button" data-i="switchCam"></button>
      </div>
    </div>
    <div class="warnbox" id="torchWarn" hidden data-i="torchWarn"></div>
    <button class="primary" id="btnFinish" type="button" hidden></button>
    <button id="btnStop" type="button" data-i="cancel"></button>
    <div class="debug" id="debug" hidden></div>
  </section>

  <!-- RESULT SCREEN -->
  <section id="scrResult" class="stack" hidden>
    <div class="card stack">
      <div class="row"><div class="label" data-i="result"></div><span class="badge" id="qBadge"></span></div>
      <div class="big">
        <div class="metric"><div class="label" data-i="restingHr"></div><div class="v" id="rHr">--</div><div class="u">bpm</div></div>
        <div class="metric"><div class="label">RMSSD</div><div class="v" id="rRm">--</div><div class="u">ms</div></div>
      </div>
      <div class="note" id="rDetail"></div>
    </div>
    <div class="warnbox" id="poorMsg" hidden data-i="poorMsg"></div>
    <div class="card stack" id="trendCard" hidden>
      <div class="label" data-i="trendTitle"></div>
      <div class="msg" id="trendMsg"></div>
      <canvas id="trendChart" height="150"></canvas>
      <div class="note" id="trendNote"></div>
    </div>
    <button class="primary" id="btnSend" type="button" hidden data-i="send"></button>
    <button id="btnAgain" type="button" data-i="again"></button>
    <button id="btnSendAnyway" type="button" hidden data-i="sendAnyway"></button>
    <div class="card stack" id="chartCard">
      <div class="label" data-i="pulseTitle"></div>
      <canvas id="pulseChart" height="110"></canvas>
      <div class="label" data-i="hrTitle"></div>
      <canvas id="hrChart" height="150"></canvas>
      <div class="note" id="hrNote"></div>
    </div>
    <details class="card">
      <summary data-i="checkData"></summary>
      <div class="stack" style="margin-top:10px">
        <canvas id="tacho" height="140"></canvas>
        <div class="note" data-i="tachoNote"></div>
        <button id="btnCopy" type="button" data-i="copy"></button>
        <button id="btnCsv" type="button" data-i="csv"></button>
        <div class="debug" id="rDebug"></div>
      </div>
    </details>
  </section>
</div>

<script>
// ENGINE START
/* PPG analysis engine: irregular camera frames -> uniform signal -> beats -> clean intervals -> HR, RMSSD. */
const PPG = (() => {
  const FS = 200;            // resampling rate (Hz)
  const HP = 0.5, LP = 6.0;  // band-pass (Hz)

  function median(a) {
    if (!a.length) return NaN;
    const s = Array.from(a).sort((x, y) => x - y), m = s.length >> 1;
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }

  // Natural cubic spline through (t, y), evaluated on a uniform grid starting at t[0].
  function resample(t, y, fs) {
    const n = t.length;
    const h = new Float64Array(n - 1);
    for (let i = 0; i < n - 1; i++) h[i] = t[i + 1] - t[i];
    const M = new Float64Array(n), cp = new Float64Array(n), dp = new Float64Array(n);
    for (let i = 1; i < n - 1; i++) {
      const a = h[i - 1], b = 2 * (h[i - 1] + h[i]), c = h[i];
      const d = 6 * ((y[i + 1] - y[i]) / h[i] - (y[i] - y[i - 1]) / h[i - 1]);
      const den = b - a * cp[i - 1];
      cp[i] = c / den;
      dp[i] = (d - a * dp[i - 1]) / den;
    }
    for (let i = n - 2; i >= 1; i--) M[i] = dp[i] - cp[i] * M[i + 1];
    const N = Math.floor((t[n - 1] - t[0]) * fs) + 1;
    const out = new Float64Array(N);
    let j = 0;
    for (let k = 0; k < N; k++) {
      const x = t[0] + k / fs;
      while (j < n - 2 && x > t[j + 1]) j++;
      const hh = h[j], A = (t[j + 1] - x) / hh, B = (x - t[j]) / hh;
      out[k] = A * y[j] + B * y[j + 1] + ((A * A * A - A) * M[j] + (B * B * B - B) * M[j + 1]) * hh * hh / 6;
    }
    return out;
  }

  function biquad(type, f0, fs) {
    const w = 2 * Math.PI * f0 / fs, c = Math.cos(w), al = Math.sin(w) / (2 * Math.SQRT1_2);
    const a0 = 1 + al;
    let b;
    if (type === 'lp') b = [(1 - c) / 2, 1 - c, (1 - c) / 2];
    else b = [(1 + c) / 2, -(1 + c), (1 + c) / 2];
    return { b0: b[0] / a0, b1: b[1] / a0, b2: b[2] / a0, a1: -2 * c / a0, a2: (1 - al) / a0 };
  }
  function run(co, x) {
    const y = new Float64Array(x.length);
    let x1 = x[0], x2 = x[0], y1 = x[0] * (co.b0 + co.b1 + co.b2) / (1 + co.a1 + co.a2), y2 = y1;
    if (!isFinite(y1)) { y1 = 0; y2 = 0; }
    for (let i = 0; i < x.length; i++) {
      const v = co.b0 * x[i] + co.b1 * x1 + co.b2 * x2 - co.a1 * y1 - co.a2 * y2;
      x2 = x1; x1 = x[i]; y2 = y1; y1 = v; y[i] = v;
    }
    return y;
  }
  function reverse(x) { const y = new Float64Array(x.length); for (let i = 0; i < x.length; i++) y[i] = x[x.length - 1 - i]; return y; }
  // Zero-phase filtering with mirrored padding (no peak shift).
  function filtfilt(co, x) {
    const n = x.length, L = Math.min(n - 1, 2 * FS);
    const p = new Float64Array(n + 2 * L);
    for (let i = 0; i < L; i++) { p[i] = 2 * x[0] - x[L - i]; p[n + L + i] = 2 * x[n - 1] - x[n - 2 - i]; }
    p.set(x, L);
    const y = reverse(run(co, reverse(run(co, p))));
    return y.subarray(L, L + n);
  }

  function bandpass(x) { return filtfilt(biquad('lp', LP, FS), filtfilt(biquad('hp', HP, FS), x)); }

  // Dominant beat period (samples) from autocorrelation, 30-180 bpm.
  function period(y) {
    const n = y.length, lo = Math.round(0.33 * FS), hi = Math.min(Math.round(2.0 * FS), n >> 1);
    let r0 = 0; for (let i = 0; i < n; i++) r0 += y[i] * y[i];
    if (r0 === 0 || hi <= lo) return 0;
    const r = new Float64Array(hi + 2);
    for (let lag = lo - 1; lag <= hi + 1; lag++) {
      let s = 0; for (let i = 0; i + lag < n; i++) s += y[i] * y[i + lag];
      r[lag] = s / (n - lag) * n / r0;
    }
    const peaks = [];
    for (let lag = lo; lag <= hi; lag++) if (r[lag] > r[lag - 1] && r[lag] >= r[lag + 1] && r[lag] > 0.2) peaks.push(lag);
    if (!peaks.length) return 0;
    let best = peaks.reduce((a, b) => r[b] > r[a] ? b : a);
    // prefer the shortest lag that is nearly as strong (avoid picking 2 beats)
    for (const p of peaks) { if (p < best && r[p] > 0.75 * r[best] && Math.abs(best / p - Math.round(best / p)) < 0.15) { best = p; break; } }
    return best;
  }

  // Beat times (s): steepest upstroke before each systolic peak, refined between samples.
  function beats(y, T) {
    const n = y.length, half = Math.max(1, Math.round(0.35 * T)), out = [];
    for (let i = 1; i < n - 1; i++) {
      if (!(y[i] > y[i - 1] && y[i] >= y[i + 1] && y[i] > 0)) continue;
      let isMax = true;
      for (let j = Math.max(0, i - half); j <= Math.min(n - 1, i + half); j++) if (y[j] > y[i]) { isMax = false; break; }
      if (!isMax) continue;
      if (out.length && i - out[out.length - 1].p < 0.5 * T) continue;
      const s = Math.max(2, i - Math.round(0.45 * T));
      let k = -1, dmax = -Infinity, trough = Infinity;
      for (let m = s; m < i; m++) {
        const d = y[m + 1] - y[m - 1];
        if (d > dmax) { dmax = d; k = m; }
        if (y[m] < trough) trough = y[m];
      }
      if (k < 2 || k >= n - 2) continue;
      const d0 = y[k] - y[k - 2], d2 = y[k + 2] - y[k], den = d0 - 2 * dmax + d2;
      const off = den !== 0 ? Math.max(-0.5, Math.min(0.5, 0.5 * (d0 - d2) / den)) : 0;
      out.push({ p: i, t: (k + off) / FS, amp: y[i] - trough });
    }
    return out;
  }

  // Hampel filter on raw frames: replaces single-frame spikes (motion, light flicker) before resampling.
  function despike(v) {
    const n = v.length, out = v.slice(), w = 3;
    for (let i = 0; i < n; i++) {
      const win = [];
      for (let j = Math.max(0, i - w); j <= Math.min(n - 1, i + w); j++) win.push(v[j]);
      const med = median(win), mad = median(win.map(x => Math.abs(x - med))) * 1.4826;
      if (mad > 0 && Math.abs(v[i] - med) > 4 * mad) out[i] = med;
    }
    return out;
  }

  // Template matching: aligns every beat to the average pulse shape using the whole waveform,
  // which gives far less timing noise than any single point. Also scores how pulse-like each beat is.
  function refine(y, bt, T) {
    const pre = Math.round(0.25 * T), post = Math.round(0.45 * T), L = pre + post + 1;
    const maxShift = Math.round(0.08 * FS);
    const seg = (c) => {
      const s = new Float64Array(L);
      for (let k = 0; k < L; k++) { const idx = c - pre + k; s[k] = idx >= 0 && idx < y.length ? y[idx] : 0; }
      let m = 0; for (const x of s) m += x; m /= L;
      let e = 0; for (let k = 0; k < L; k++) { s[k] -= m; e += s[k] * s[k]; }
      e = Math.sqrt(e) || 1; for (let k = 0; k < L; k++) s[k] /= e;
      return s;
    };
    for (let pass = 0; pass < 2; pass++) {
      const tpl = new Float64Array(L);
      let cnt = 0;
      for (const b of bt) { if (b.corr !== undefined && b.corr < 0.8) continue; const s = seg(Math.round(b.t * FS)); for (let k = 0; k < L; k++) tpl[k] += s[k]; cnt++; }
      if (cnt < 5) return bt;
      let e = 0; for (const x of tpl) e += x * x; e = Math.sqrt(e) || 1;
      for (let k = 0; k < L; k++) tpl[k] /= e;
      for (const b of bt) {
        const c0 = Math.round(b.t * FS);
        const cc = [];
        for (let sh = -maxShift; sh <= maxShift; sh++) {
          const s = seg(c0 + sh); let r = 0; for (let k = 0; k < L; k++) r += s[k] * tpl[k]; cc.push(r);
        }
        let k = 0; for (let i = 1; i < cc.length; i++) if (cc[i] > cc[k]) k = i;
        let off = 0;
        if (k > 0 && k < cc.length - 1) { const den = cc[k - 1] - 2 * cc[k] + cc[k + 1]; if (den < 0) off = 0.5 * (cc[k - 1] - cc[k + 1]) / den; }
        b.t = (c0 + (k - maxShift) + off) / FS;
        b.corr = cc[k];
      }
    }
    return bt;
  }

  // Intervals with artifact rejection: physiological range, amplitude, pulse shape, and >20% from local median.
  function intervals(bt) {
    const amps = bt.map(b => b.amp), ampMed = median(amps);
    const list = [];
    for (let i = 0; i + 1 < bt.length; i++) {
      const ibi = (bt[i + 1].t - bt[i].t) * 1000;
      let ok = ibi >= 300 && ibi <= 2000;
      for (const b of [bt[i], bt[i + 1]]) {
        if (b.amp < 0.3 * ampMed || b.amp > 3 * ampMed) ok = false;
        if (b.corr !== undefined && b.corr < 0.85) ok = false;
      }
      list.push({ t: bt[i + 1].t, ibi: ibi, valid: ok });
    }
    for (let i = 0; i < list.length; i++) {
      const nb = [];
      for (let j = Math.max(0, i - 5); j <= Math.min(list.length - 1, i + 5); j++)
        if (j !== i && list[j].ibi >= 300 && list[j].ibi <= 2000) nb.push(list[j].ibi);
      const med = median(nb);
      if (isFinite(med) && Math.abs(list[i].ibi - med) > 0.2 * med) list[i].valid = false;
    }
    return list;
  }

  function metrics(list) {
    const v = list.filter(x => x.valid).map(x => x.ibi);
    const diffs = [];
    for (let i = 0; i + 1 < list.length; i++) if (list[i].valid && list[i + 1].valid) diffs.push(list[i + 1].ibi - list[i].ibi);
    if (v.length < 10 || diffs.length < 8) return null;
    const mean = v.reduce((s, x) => s + x, 0) / v.length;
    const rmssd = Math.sqrt(diffs.reduce((s, d) => s + d * d, 0) / diffs.length);
    const sdnn = Math.sqrt(v.reduce((s, x) => s + (x - mean) * (x - mean), 0) / (v.length - 1));
    return { hr: 60000 / mean, meanIbi: mean, rmssd: rmssd, lnRmssd: Math.log(rmssd), sdnn: sdnn, valid: v.length, pairs: diffs.length };
  }

  // Main entry. tMs: frame timestamps (ms), x: mean brightness per frame (one colour channel).
  function analyze(tMs, x) {
    const t = [], v = [];
    for (let i = 0; i < tMs.length; i++) {
      if (!isFinite(tMs[i]) || !isFinite(x[i])) continue;
      if (t.length && tMs[i] / 1000 <= t[t.length - 1] + 1e-4) continue;
      t.push(tMs[i] / 1000); v.push(-x[i]); // invert: more blood = darker
    }
    if (t.length < 50) return { error: 'Too few camera frames' };
    const dur = t[t.length - 1] - t[0];
    if (dur < 8) return { error: 'Recording too short' };
    const y = bandpass(resample(t, despike(v), FS));
    const T = period(y);
    if (!T) return { error: 'No clear pulse found' };
    const bt = refine(y, beats(y, T), T);
    const list = intervals(bt);
    const m = metrics(list);
    const fps = (t.length - 1) / dur;
    const validFrac = list.length ? list.filter(z => z.valid).length / list.length : 0;
    if (!m) return { error: 'Not enough clean beats', fps: fps, quality: validFrac, intervals: list, duration: dur };
    const shape = median(bt.filter(b => b.corr !== undefined).map(b => b.corr));
    const wave = []; for (let i = 0; i < y.length; i += 4) wave.push(y[i]);   // 50 Hz copy for the result chart
    return Object.assign(m, { fps: fps, duration: dur, quality: validFrac, total: list.length, intervals: list, periodS: T / FS, shape: shape,
      wave: wave, waveFs: FS / 4, beatT: bt.map(b => b.t) });
  }

  function grade(r) {
    if (!r || r.error) return 'poor';
    const expected = r.duration / (r.meanIbi / 1000);
    const coverage = r.valid / Math.max(1, expected);
    if (r.quality >= 0.95 && coverage >= 0.85) return 'good';
    if (r.quality >= 0.85 && coverage >= 0.7) return 'ok';
    return 'poor';
  }

  return { analyze: analyze, grade: grade, median: median, bandpass: bandpass, resample: resample, FS: FS };
})();
// ENGINE END
</script>

  const t0 = list[0].t, t1 = list[list.length - 1].t || t0 + 1;
  g.font = '22px ' + css.getPropertyValue('--font'); g.fillStyle = css.getPropertyValue('--muted');
  g.fillText(Math.round(hi) + ' ms', 8, 26); g.fillText(Math.round(lo) + ' ms', 8, H - 10);
  list.forEach(x => {
    const px = 90 + (x.t - t0) / (t1 - t0 || 1) * (W - 110), py = H - 20 - (x.ibi - lo) / span * (H - 50);

/* ---- History & 7-day trend (stored on this phone, per athlete) ---- */
const HKEY = () => 'hrvHistory:' + (NAME || 'me');
function loadHistory() {
  try {
    let h = JSON.parse(lsGet(HKEY(), 'null'));
    if (!h) { h = JSON.parse(lsGet('hrvHistory', '[]')) || []; }   // results saved by older versions
    return Array.isArray(h) ? h : [];
  } catch (e) { return []; }
}
function saveHistory(r) {
  const h = loadHistory();
  h.unshift({ when: r.when.toISOString(), hr: Math.round(r.hr), rmssd: +r.rmssd.toFixed(1), ln: +r.lnRmssd.toFixed(3), q: r.grade, dur: Math.round(r.duration) });
  lsSet(HKEY(), JSON.stringify(h.slice(0, 90)));
  renderHistory();
}
function renderHistory() {
  const h = loadHistory();
  $('histBox').hidden = !h.length;
  const q = { good: t('good'), ok: t('ok'), poor: t('poor') };
  $('histTable').innerHTML = '<tr><th>' + t('thDate') + '</th><th>HR</th><th>RMSSD</th><th>' + t('thSignal') + '</th></tr>' +
    h.slice(0, 30).map(x => {
      const d = new Date(x.when);
      return '<tr><td>' + d.toLocaleDateString(LOCALE(), { day: '2-digit', month: 'short' }) + ' ' +
        d.toLocaleTimeString(LOCALE(), { hour: '2-digit', minute: '2-digit' }) + '</td><td>' + x.hr + '</td><td>' + x.rmssd + '</td><td>' + (q[x.q] || x.q) + '</td></tr>';
    }).join('');
}
function dayKey(d) { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); }
function dailySeries() {
  const byDay = {};
  loadHistory().filter(x => x.q !== 'poor' && x.ln).slice().reverse().forEach(x => { byDay[dayKey(x.when)] = x; }); // latest reading per day
  return Object.keys(byDay).sort().map(k => ({ day: k, ln: byDay[k].ln, rmssd: byDay[k].rmssd }));
}
function drawTrend() {
  const s = dailySeries();
  if (!s.length) { $('trendCard').hidden = true; return; }
  const cur = s[s.length - 1];
  const prev = s.slice(0, -1).slice(-30);
  const need = Math.max(0, 3 - prev.length);
  let low = null, high = null, status = null;
  if (!need) {
    const ls = prev.map(x => x.ln), m = ls.reduce((a, b) => a + b, 0) / ls.length;
    const sd = Math.sqrt(ls.reduce((a, b) => a + (b - m) * (b - m), 0) / Math.max(1, ls.length - 1));
    const half = Math.max(0.5 * sd, 0.04);
    low = m - half; high = m + half;
    status = cur.ln < low ? 'low' : cur.ln > high ? 'high' : 'normal';
  }
  const msg = $('trendMsg');
  if (need) { msg.className = 'msg info'; msg.textContent = t('trendNeed', { n: need }); }
  else { msg.className = 'msg ' + status; msg.textContent = t({ low: 'trendLow', high: 'trendHigh', normal: 'trendNormal' }[status]); }
  $('trendNote').textContent = need ? '' : t('trendNote');

  const pts = s.slice(-7);
  const { g, W, H, css } = chartCtx('trendChart');
  const vals = pts.map(p => p.rmssd).concat(low !== null ? [Math.exp(low), Math.exp(high)] : []);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const padV = Math.max(4, (hi - lo) * 0.2); lo = Math.max(0, lo - padV); hi = hi + padV;
  const L = 70, R = 24, T = 18, B = 44;
  const X = i => pts.length === 1 ? (L + W - R) / 2 : L + i / (pts.length - 1) * (W - L - R);
  const Y = v => T + (hi - v) / ((hi - lo) || 1) * (H - T - B);
  g.font = '22px ' + css.getPropertyValue('--font');
  if (low !== null) {
    g.fillStyle = css.getPropertyValue('--good-soft');
    g.fillRect(L, Y(Math.exp(high)), W - L - R, Y(Math.exp(low)) - Y(Math.exp(high)));
  }
  g.fillStyle = css.getPropertyValue('--muted');
  g.fillText(Math.round(hi) + ' ms', 4, T + 16); g.fillText(Math.round(lo) + ' ms', 4, H - B);
  g.strokeStyle = css.getPropertyValue('--accent'); g.lineWidth = 4; g.lineJoin = 'round';
  g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(X(i), Y(p.rmssd)) : g.moveTo(X(i), Y(p.rmssd))); g.stroke();
  pts.forEach((p, i) => {
    const last = i === pts.length - 1;
    g.fillStyle = css.getPropertyValue(last ? '--accent' : '--fg');
    g.beginPath(); g.arc(X(i), Y(p.rmssd), last ? 11 : 6, 0, Math.PI * 2); g.fill();
    const lbl = new Date(p.day + 'T12:00:00').toLocaleDateString(LOCALE(), { weekday: 'short' });
    g.fillStyle = css.getPropertyValue('--muted');
    g.fillText(lbl, X(i) - g.measureText(lbl).width / 2, H - 10);
  });
}

/* ---- Results out ---- */
function sendToForm() {
  if (!lastResult || !FORM_URL) return;
  location.href = FORM_URL.replace('HRVRMSSD', lastResult.rmssd.toFixed(1)).replace('HRVRHR', String(Math.round(lastResult.hr)));
}
function resultText(r) {
  return 'Morning HRV ' + r.when.toLocaleString() + (NAME ? ' · ' + NAME : '') + '\nHR ' + Math.round(r.hr) + ' bpm, RMSSD ' +
    r.rmssd.toFixed(1) + ' ms, ln RMSSD ' + r.lnRmssd.toFixed(2) + ', quality ' + Math.round(r.quality * 100) + '% (' + r.grade + '), ' +
    r.valid + ' beats, ' + r.fps.toFixed(1) + ' fps';
}
function downloadCsv() {
  if (!lastResult) return;
  const rows = ['beat,time_s,ibi_ms,valid'].concat(lastResult.intervals.map((x, i) => (i + 1) + ',' + x.t.toFixed(3) + ',' + x.ibi.toFixed(1) + ',' + (x.valid ? 1 : 0)));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([rows.join('\n')], { type: 'text/csv' }));
  a.download = 'hrv_' + lastResult.when.toISOString().slice(0, 16).replace(/[:T]/g, '-') + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---- Install as an app ---- */
let deferredPrompt = null;
const standalone = window.matchMedia && matchMedia('(display-mode: standalone)').matches;
if (standalone) $('installHow').hidden = true;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if (!standalone) $('installBox').hidden = false; });
$('btnInstall').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  try { await deferredPrompt.userChoice; } catch (e) { }
  deferredPrompt = null; $('installBox').hidden = true;
});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

/* ---- Wiring ---- */
if (!FORM_URL) $('noSend').hidden = false;
if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $('notSupported').hidden = false; $('btnStart').disabled = true; }
document.querySelectorAll('#durSeg button').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.d === 'custom') setDur(customValue(), true); else setDur(Number(b.dataset.d));
}));
['cMin', 'cSec', 'cOpen'].forEach(id => $(id).addEventListener('change', () => setDur(customValue(), true)));
['cMin', 'cSec'].forEach(id => $(id).addEventListener('input', () => setDur(customValue(), true)));
$('btnFinish').addEventListener('click', () => { if (running && phase === 'record') finish(); });
$('btnLang').addEventListener('click', () => { LANG = LANG === 'hi' ? 'en' : 'hi'; lsSet('hrvLang', LANG); applyLang(); });
$('btnStart').addEventListener('click', start);
$('btnSwitch').addEventListener('click', switchCamera);
$('btnStop').addEventListener('click', () => { stop(); show('scrStart'); });
$('btnAgain').addEventListener('click', () => show('scrStart'));
$('btnSend').addEventListener('click', sendToForm);
$('btnSendAnyway').addEventListener('click', sendToForm);
$('btnCsv').addEventListener('click', downloadCsv);
$('btnCopy').addEventListener('click', () => {
  if (!lastResult) return;
  const txt = resultText(lastResult);
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => { $('btnCopy').textContent = t('copied'); }, () => { });
});
$('btnTestCue').addEventListener('click', () => {
  unlockAudio();
  tones([[880, 160, 90], [1320, 260]]);
  if (!('vibrate' in navigator)) { $('cueMsg').textContent = t('cueNo'); return; }
  let ok = false; try { ok = navigator.vibrate([400, 150, 400]); } catch (e) { ok = false; }
  $('cueMsg').textContent = t(ok ? 'cueSent' : 'cueBlocked');
});
$('btnResetCam').addEventListener('click', () => { lsDel('hrvCam'); $('camMsg').textContent = t('camReset'); });
$('btnForget').addEventListener('click', () => { lsDel('hrvProfile'); profile = {}; FORM_URL = ''; NAME = ''; $('noSend').hidden = false; applyLang(); });
let verTaps = 0;
$('ver').addEventListener('click', () => {   // tap the version 5 times to show technical details while measuring
  if (++verTaps >= 5) { verTaps = 0; DEBUG = !DEBUG; lsSet('hrvDebug', DEBUG ? '1' : ''); $('ver').textContent = 'App version ' + VERSION + (DEBUG ? ' · debug on' : ''); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && running) { stop(); show('scrStart'); } });
$('ver').textContent = 'App version ' + VERSION + (DEBUG ? ' · debug on' : '');
if (durS === 0) $('cOpen').checked = true;
else if (!PRESETS.includes(durS)) { $('cMin').value = Math.floor(durS / 60); $('cSec').value = durS % 60; }
setDur(durS === 0 || (durS >= MIN_S && durS <= MAX_S) ? durS : 60);
applyLang();
</script>
</body>
